<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roue Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: féerique, joyeux, une soirée de Noël entre amis, avec un clin d'oeil pour chacun
   IDEA: un sapin de réveillon dont on décroche sa boule, puis une roue de fête foraine illuminée
   PICTURE: le sapin et ses 12 boules, puis la roue cerclée d'ampoules, puis un cadeau qui s'ouvre
   COLOUR and TYPE: nuit bleu profond, rouge baie, vert sapin, or chaud (chaque invité a sa palette) ; Mountains of Christmas + Fredoka
   LAYOUT: une colonne centrée, une scène par étape, très peu de texte */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:#081427}
html,body{margin:0}
body{--night:#081427;--deep:#17365a;--ink:#f4f1ea;--soft:#b8c7d9;--red:#d62839;--red2:#7e0f1d;--gold:#f2c14e;--gold2:#a87410;--aur1:rgba(64,224,170,.18);--aur2:rgba(90,140,255,.16);--halo:rgba(242,193,78,.28);--box-l:#e0394a;--box-d:#9c1424;--rib-l:#ffe38f;--rib-d:#b47d12;
background:radial-gradient(120% 70% at 50% 0%,var(--deep) 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font:17px/1.5 Fredoka,system-ui,sans-serif;overflow-x:clip;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:70vh;background:radial-gradient(40% 50% at 30% 40%,var(--aur1),transparent 70%),radial-gradient(35% 45% at 70% 30%,var(--aur2),transparent 70%);filter:blur(30px);animation:aurora 14s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes aurora{to{transform:translateX(8%) scaleY(1.2)}}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:1}#fx{z-index:60}
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* guirlande */
.garland{position:relative;height:64px}
.garland svg{position:absolute;inset:0;width:100%;height:40px}
.bulb{position:absolute;width:14px;height:22px;margin-left:-7px;transform-origin:50% 0}
.bulb::before{content:"";position:absolute;left:4px;top:0;width:6px;height:6px;background:#3b4a3e;border-radius:2px}
.bulb::after{content:"";position:absolute;left:1px;top:5px;width:12px;height:17px;border-radius:50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 14px 4px var(--c);animation:twinkle 1.8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.2)}50%{opacity:.35;filter:brightness(.6);box-shadow:0 0 2px 0 var(--c)}}
header{text-align:center;padding:4px 16px 0}
h1{font:700 clamp(46px,10vw,84px)/1 "Mountains of Christmas",Fredoka,serif;margin:0;background:linear-gradient(180deg,#fff6d6 10%,#f2c14e 55%,#c98a17 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(242,193,78,.45)) drop-shadow(0 3px 0 rgba(0,0,0,.4));text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tag,.budget{padding:4px 14px;border-radius:99px;font-size:15px;white-space:nowrap}
.tag{border:1px solid rgba(242,193,78,.5);color:#f2c14e;background:rgba(8,20,39,.35)}
.budget{background:var(--red);color:#fff;font-weight:600;box-shadow:0 0 18px rgba(214,40,57,.5)}
main{width:100%;max-width:860px;margin:0 auto;padding:20px max(4vw,14px) 20px;flex:1}
h2{font-size:clamp(30px,6.4vw,46px);line-height:1.1;margin:0 0 10px;text-align:center;text-wrap:balance;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.warn{width:fit-content;max-width:100%;margin:0 auto 6px;padding:7px 16px;border-radius:14px;text-align:center;background:rgba(214,40,57,.18);border:1.5px solid rgba(255,120,130,.7);color:#ffe9c4}
.warn strong{color:#ff8a94}
.screen{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}}
button{font:inherit;cursor:pointer;color:inherit}
button,.stage,#memo{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
/* sapin */
.treebox{--tw:min(560px,96vw);--bs:calc(var(--tw)*.155);position:relative;width:var(--tw);aspect-ratio:100/138;margin:0 auto}
body.fit .wrap{height:100vh;height:100dvh;overflow:hidden}
body.fit footer{display:none}
body.fit main{padding-bottom:0}
.treesvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl{animation:twinkle2 1.6s ease-in-out infinite}
@keyframes twinkle2{50%{opacity:.25}}
.topstar{transform-box:fill-box;transform-origin:center;animation:starglow 2.4s ease-in-out infinite}
@keyframes starglow{50%{transform:scale(1.12);filter:drop-shadow(0 0 5px #ffd76a)}}
.slot{position:absolute;width:var(--bs);height:var(--bs);margin:calc(var(--bs)/-2) 0 0 calc(var(--bs)/-2);transition:left 1.1s cubic-bezier(.4,0,.6,1),top 1.1s cubic-bezier(.6,0,1,.5);z-index:2}
.slot.foot{z-index:3;scale:.9}
.slot.foot::after{content:"";position:absolute;left:4%;right:4%;bottom:-9%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff 45%,#dfeaf7 100%);pointer-events:none;box-shadow:0 3px 6px rgba(60,90,130,.25)}
.slot.landed{animation:land .6s ease-out}
@keyframes land{30%{transform:translateY(-14%) scaleY(.92)}60%{transform:translateY(0) scaleY(1.04)}}
.orn{position:relative;width:100%;height:100%;border:0;padding:0;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:clamp(10.5px,calc(var(--bs)*.2),16px);line-height:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);transform-origin:50% -40%;animation:sway var(--sw,5s) ease-in-out infinite;animation-delay:var(--sd,0s);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 4%,rgba(255,255,255,.25) 12%,transparent 24%),radial-gradient(circle at 50% 60%,var(--c1),var(--c2) 72%);box-shadow:0 8px 16px rgba(0,0,0,.45),inset -6px -8px 14px rgba(0,0,0,.35);transition:box-shadow .25s,scale .25s}
.orn::before{content:"";position:absolute;left:50%;top:-18%;width:26%;height:13%;margin-left:-13%;border-radius:2px 2px 1px 1px;background:linear-gradient(90deg,#8d6b1c,#f8e3a0 45%,#9d7a25)}
.orn::after{content:"";position:absolute;left:50%;top:-34%;width:1.5px;height:17%;background:#d9c37f}
.orn:focus-visible{scale:1.1}
@media(hover:hover){.orn:hover{scale:1.1;box-shadow:0 0 24px 5px var(--c1),inset -6px -8px 14px rgba(0,0,0,.35);animation-duration:.9s}.stage.ready:hover #wheelsvg{transform:scale(1.02) rotate(2deg)}}
.orn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot .orn{transform-origin:50% 50%;transform:rotate(var(--tilt,0deg));animation:footglow 2.4s ease-in-out infinite}
.foot .orn::after{display:none}
@keyframes footglow{0%,100%{box-shadow:0 4px 10px rgba(40,70,110,.35),inset -6px -8px 14px rgba(0,0,0,.35)}50%{box-shadow:0 0 22px 5px var(--c1),inset -6px -8px 14px rgba(0,0,0,.35)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* carte confirmation */
.card{max-width:460px;margin:30px auto 0;padding:30px 24px;border-radius:22px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card .lead{color:var(--soft);font-size:20px}
.card .big{font:700 clamp(46px,10vw,64px)/1.05 "Mountains of Christmas",Fredoka,serif;color:var(--gold);margin:4px 0 8px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{min-height:52px;padding:12px 30px;border-radius:16px;border:0;font-weight:600;font-size:19px;color:#fff;background:linear-gradient(180deg,#ef3b4e,var(--red) 50%,#b31b2b);box-shadow:0 5px 0 var(--red2),0 10px 24px rgba(214,40,57,.45);transition:transform .1s,box-shadow .1s,filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px)}
.btn.gold{color:#3a2600;background:linear-gradient(180deg,#ffe08a,#f2c14e 55%,#d99c1f);box-shadow:0 5px 0 #a87410,0 10px 28px rgba(242,193,78,.45)}
.btn.big{font-size:22px;padding:14px 40px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #a87410,0 0 40px 10px rgba(242,193,78,.55)}}
.ghost{min-height:52px;padding:12px 26px;border-radius:16px;background:rgba(8,20,39,.35);border:2px solid rgba(255,255,255,.3);font-size:18px}
.ghost:hover{border-color:#fff}
/* roue */
#deco{display:flex;justify-content:center;align-items:center;gap:16px;height:40px;margin:0 0 2px}
#deco>*{animation:bob 2.4s ease-in-out infinite;line-height:1}
#deco>:nth-child(2n){animation-delay:-.8s}#deco>:nth-child(3n){animation-delay:-1.6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.stage{position:relative;width:min(440px,90vw,50vh);width:min(440px,90vw,50dvh);aspect-ratio:1;margin:14px auto 0;-webkit-tap-highlight-color:transparent}
.stage.ready{cursor:pointer}
.stage::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,var(--halo),transparent 65%);animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{opacity:.5;transform:scale(.96)}}
#wheelsvg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));transition:transform .3s}
#pointer{position:absolute;left:50%;top:-4%;width:13%;height:auto;margin-left:-6.5%;z-index:3;transform-origin:50% 22%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
#pointer.tick{animation:tick .12s ease-out}
@keyframes tick{40%{transform:rotate(-22deg)}}
#hub{position:absolute;left:50%;top:50%;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:2;pointer-events:none}
#hub img{width:100%;height:auto;display:block}
#hub span{font-size:clamp(22px,7vw,34px);line-height:1}
.rb{fill:#fff3c4;animation:chase 1.2s steps(1) infinite}
.rb:nth-child(odd){animation-delay:-.6s}
@keyframes chase{0%{fill:#fff6cf;filter:drop-shadow(0 0 3px #ffd76a)}50%{fill:#7a5a17;filter:none}}
.spinning .rb{animation-duration:.25s}.spinning .rb:nth-child(odd){animation-delay:-.125s}
.status{text-align:center;min-height:34px;margin-top:16px;font-size:21px;color:var(--gold);font-weight:500;text-wrap:balance}
.status.suspense{animation:beat .5s ease-in-out infinite;font-size:24px}
@keyframes beat{50%{transform:scale(1.1)}}
body.isspin[data-person="Damien"] main{animation:quake .14s linear infinite}
@keyframes quake{25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
body.isspin[data-person="Alba"] .stage{animation:lev 2.2s ease-in-out infinite}
@keyframes lev{50%{transform:translateY(-16px) rotate(-1.5deg)}}
#memo{position:relative;width:min(280px,66vw,38vh);margin:30px auto 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#memo::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,var(--halo),transparent 65%);animation:halo 3s ease-in-out infinite}
#memo .gift{position:relative;width:100%;animation:giftbob 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
@keyframes giftbob{50%{transform:translateY(-12px) rotate(-2.5deg)}}
#memo .qm{position:absolute;left:0;right:0;top:54%;text-align:center;font:700 clamp(54px,15vw,76px)/1 "Mountains of Christmas",Fredoka,serif;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.6);animation:giftbob 2.6s ease-in-out infinite;pointer-events:none}
#ask{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;background:rgba(3,8,18,.74);backdrop-filter:blur(5px)}
#ask .card{margin:0;width:100%;background:var(--night);background:color-mix(in srgb,var(--deep) 62%,#000);border:2px solid var(--gold);animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
#ask .card .lead{color:var(--ink)}
/* étiquette résultat */
.gifttag{position:relative;max-width:420px;margin:22px auto 0;padding:20px 24px 20px 54px;text-align:center;background:linear-gradient(135deg,#fff8e6,#f3e2b8);color:#3b2a12;border-radius:10px 22px 22px 10px;box-shadow:0 16px 40px rgba(0,0,0,.45);clip-path:polygon(28px 0,100% 0,100% 100%,28px 100%,0 50%)}
.gifttag::before{content:"";position:absolute;left:22px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--night);box-shadow:inset 0 0 0 3px #c9a55a}
.gifttag .who{font:700 clamp(42px,9vw,58px)/1.05 "Mountains of Christmas",Fredoka,serif;color:#c21f30;margin:2px 0}
.gifttag small{color:#7a6440;font-size:15px}
.gifttag .budgetline{display:block;margin-top:4px;font-weight:600;color:#c21f30}
/* révélation */
#reveal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,8,18,.97);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--deep) 55%,#000),rgba(3,8,18,.985));padding:20px;overflow:hidden}
.rays{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(242,193,78,.14) 0 6deg,transparent 6deg 18deg);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 16%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);opacity:0;transition:opacity 1s}
#reveal.open .rays{opacity:1;animation:spinrays 24s linear infinite}
@keyframes spinrays{to{transform:rotate(360deg)}}
.rv{position:relative;text-align:center;max-width:560px}
.gift{width:min(200px,48vw,26vh);height:auto;overflow:visible;display:block;margin:0 auto}
.gift .lid{transform-box:fill-box;transform-origin:50% 100%}
#reveal.shake .gift{animation:shake .7s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
#reveal.open .gift .lid{animation:lid 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes lid{40%{transform:translate(-10%,-120%) rotate(-28deg)}100%{transform:translate(-60%,-260%) rotate(-70deg);opacity:0}}
.rv .pre{opacity:0;font-size:20px;color:var(--soft);margin-top:14px;text-wrap:balance}
.rv .name{opacity:0;font:700 clamp(64px,16vw,120px)/1 "Mountains of Christmas",Fredoka,serif;color:#fff;text-shadow:0 0 20px var(--gold),0 0 50px var(--gold),0 4px 0 rgba(0,0,0,.5)}
.rv .post{opacity:0;color:var(--soft);margin:10px 0 0;text-wrap:balance}
.rv .post strong{display:block;color:var(--gold);margin-top:2px}
#reveal.open .pre{animation:fade .6s .5s forwards}
#reveal.open .name{animation:pop 1s .8s cubic-bezier(.2,1.6,.4,1) forwards}
#reveal.open .post,#reveal.open .row{animation:fade .6s 1.8s forwards}
#reveal .row{opacity:0}
@keyframes fade{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(60px) scale(.3)}100%{opacity:1;transform:none}}
#sound{position:fixed;top:12px;right:12px;z-index:70;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,20,39,.6);display:grid;place-items:center}
#sound svg{width:22px;height:22px}
footer{position:relative;z-index:2;line-height:0}
footer svg{display:block;width:100%;height:clamp(150px,20vw,260px)}
@media(max-width:640px){
.garland{height:46px}
h1{font-size:40px}
.pills{gap:6px;margin-top:6px}.tag,.budget{font-size:13px;padding:3px 11px}
main{padding-top:14px}
h2{font-size:28px;margin-bottom:8px}
.warn{font-size:15px;padding:6px 12px}
body:not([data-screen="s-who"]) .pills{display:none}
body:not([data-screen="s-who"]) h1{font-size:34px}
body:not([data-screen="s-who"]) .garland{height:40px}
#s-wheel h2{font-size:25px}
#deco{height:34px}
.stage{margin-top:8px}
.status{margin-top:10px;min-height:30px;font-size:19px}.status.suspense{font-size:22px}
#s-wheel .row{margin-top:12px}
.btn.big{font-size:20px;padding:12px 32px}
.card{margin-top:16px;padding:24px 18px}
.rv .pre{font-size:18px}
}
@media(max-width:640px) and (max-height:720px){
body[data-screen="s-who"] .garland{height:40px}
body[data-screen="s-who"] h1{font-size:34px}
body[data-screen="s-who"] .pills{margin-top:4px}
body[data-screen="s-who"] main{padding-top:8px}
body[data-screen="s-who"] h2{font-size:24px;margin-bottom:6px}
body[data-screen="s-who"] .warn{font-size:14px;padding:4px 10px;margin-bottom:2px}
}
@media(min-width:641px) and (max-height:860px){
body[data-screen="s-who"] .garland{height:50px}
body[data-screen="s-who"] h1{font-size:56px}
body[data-screen="s-who"] main{padding-top:12px}
body[data-screen="s-who"] h2{font-size:36px;margin-bottom:8px}
body[data-screen="s-who"] .warn{padding:5px 14px;font-size:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="sound" type="button" aria-label="Couper le son" title="Son"><svg viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#f4f1ea"/><path id="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
<div class="wrap">
<div class="garland" id="garland"><svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 Q12.5 42 25 6 Q37.5 42 50 6 Q62.5 42 75 6 Q87.5 42 100 6" fill="none" stroke="#24382b" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
<header><h1>Secret Santa</h1><div class="pills"><span class="tag">Noël 2026 · Chez Kawthar &amp; Nour</span><span class="budget">Budget 15 € max</span></div></header>
<main>
<section class="screen" id="s-who">
<h2 id="who-title">Choisis ta boule avec ton prénom !</h2>
<p class="warn"><strong>Important :</strong> ne clique pas sur un autre prénom !</p>
<div class="treebox"><svg class="treesvg" id="treesvg" viewBox="0 0 100 138" aria-hidden="true">
<defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#0c4a2c"/><stop offset=".45" stop-color="#1f8a52"/><stop offset="1" stop-color="#0a3a22"/></linearGradient><radialGradient id="tglow"><stop offset="0" stop-color="rgba(255,215,106,.35)"/><stop offset="1" stop-color="rgba(255,215,106,0)"/></radialGradient><radialGradient id="sng" cx=".5" cy="0" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eaf2fc"/><stop offset="1" stop-color="#cddbec"/></radialGradient></defs>
<g id="treeg"></g>
</svg><div id="names"></div></div>
</section>

<section class="screen" id="s-confirm" hidden>
<div class="card">
<div class="lead">Tu es bien</div>
<div class="big" id="confirm-name"></div>
<div class="row"><button class="btn gold" id="yes" type="button">Oui, c'est moi</button><button class="ghost" id="no" type="button">Non, retour</button></div>
</div>
</section>

<section class="screen" id="s-wheel" hidden>
<h2 id="hello"></h2>
<div id="deco" aria-hidden="true" hidden></div>
<div class="stage" id="stage">
<svg id="pointer" viewBox="0 0 60 80" aria-hidden="true"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#b47d12"/><stop offset=".5" stop-color="#ffe38f"/><stop offset="1" stop-color="#b47d12"/></linearGradient></defs><path d="M30 78 L10 26 A21 21 0 1 1 50 26 Z" fill="url(#pg)" stroke="#6b4a06" stroke-width="2.5"/><path d="M30 6 l4.4 9 9.9 1.4 -7.2 7 1.7 9.8 -8.8-4.6 -8.8 4.6 1.7-9.8 -7.2-7 9.9-1.4z" fill="#d62839" stroke="#fff3c4" stroke-width="1.2"/></svg>
<svg id="wheelsvg" viewBox="-120 -120 240 240" role="img" aria-label="Roue du Secret Santa">
<defs id="wdefs"></defs>
<circle r="117" fill="url(#rim)" stroke="#5e4208" stroke-width="2"/>
<circle r="104" fill="#3b2705"/>
<g id="wheel"></g>

let cur=DEF,curName=null,plain=false; /* plain : écrans « revoir » et avertissement, toujours en français */
const T=(k,fr)=>(cur.tx&&k in cur.tx&&!((fr||plain)&&cur.foreign)?cur.tx[k]:DEF.tx[k]).replace("{n}",cur.nick||me||"").replace("{de}",(/^[AEIOUY]/.test(me||"")?"d'":"de ")+(me||""));
function applyTheme(name){
  const t=name&&THEMES[name]||null;cur=t||DEF;curName=t?name:null;
  const b=document.body;b.dataset.person=t?name:"";
  b.removeAttribute("style");if(t)for(const k in t.vars)b.style.setProperty(k,t.vars[k]);
  document.documentElement.style.background=t?t.vars["--night"]:"";
  $("scene").innerHTML=SCENES[cur.scene||"pines"];
  const d=$("deco");if(t){d.hidden=false;d.innerHTML=(t.deco||[0,1,2,1,0].map(i=>t.sprites[i%t.sprites.length])).map(k=>sprHTML(k==="steam"?"⚔️":k,30)).join("")}else{d.hidden=true;d.innerHTML=""}
  const h=$("hub");if(t&&t.hub){h.hidden=false;h.innerHTML=sprHTML(t.hub,40);$("hubstar").style.display="none"}else{h.hidden=true;h.innerHTML="";$("hubstar").style.display=""}
  $("spin").textContent=T("spin");$("back").textContent=T("back");$("rvback").textContent=T("back");$("close").textContent=T("again");
  $("rv-pre").textContent=T("pre");$("rv-post").textContent=T("post");$("rv-budget").textContent=T("budget");$("tag-pre").textContent=T("tagpre");$("tag-budget").textContent=T("budget");
  mkExtras();

/* ---------- son ---------- */
function audio(){if(muted)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function tone(f,t0,dur,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
function tick(){tone(2200,0,.04,"square",.035)}
function bell(f,t){tone(f,t,1.4,"sine",.18);tone(f*2.01,t,.8,"sine",.06);tone(f*3.02,t,.4,"triangle",.03)}
function fanfare(){[[784,0],[988,.14],[1175,.28],[1568,.42],[1319,.7],[1568,.84]].forEach(([f,t])=>bell(f,t));[523,659,784,1047].forEach(f=>tone(f,1.05,2.2,"triangle",.05))}
$("sound").addEventListener("click",()=>{muted=!muted;$("wave").style.display=muted?"none":"";$("sound").setAttribute("aria-label",muted?"Activer le son":"Couper le son")});

/* ---------- guirlande ---------- */
{const g=$("garland"),cols=["#ff4d5e","#ffd76a","#3cc47a","#6fb3ff","#ff9f43"];let h="";const N=window.innerWidth<640?16:28;
for(let i=0;i<N;i++){const x=(i+.5)/N,u=(x*4)%1,y=6+72*u*(1-u);h+=`<span class="bulb" style="left:${(x*100).toFixed(2)}%;top:${(y-2).toFixed(1)}px;--c:${cols[i%cols.length]};--d:${(-Math.random()*1.8).toFixed(2)}s;transform:rotate(${((u-.5)*-40).toFixed(0)}deg)"></span>`}
g.insertAdjacentHTML("beforeend",h)}

/* ---------- neige et objets qui tombent ---------- */
const snow=$("snow"),sc=snow.getContext("2d"),fx=$("fx").getContext("2d");let flakes=[],extras=[],W=0,H=0,DPR=1,boost=0;
function mkExtras(){extras=[];const t=cur;if(!t.sprites||!W)return;const mob=W<600,n=Math.round((t.count||18)*(mob?.75:1.15)*(REDUCED?.4:1)),m=mob?1:1.3;
  for(let i=0;i<n;i++){const k=t.sprites[i%t.sprites.length],rise=(t.rise||[]).includes(k),st=k==="steam",u=(i*.618+.13)%1;
    const sz=st?R(80,150)*m:(u<.38?R(20,30):u<.76?R(38,54):R(64,92))*m;
    extras.push({k,x:Math.random()*W,y:Math.random()*H,sz,s:R(.4,.8)*(.55+sz/70)*(rise?-1:1),p:Math.random()*6.28,r:Math.random()*6.28,vr:R(-.02,.02)*(40/sz),a:st?.45:sz<32*m?.7:.95,up:UP.includes(k)})}
  extras.sort((p,q)=>p.sz-q.sz)}
function sizeSnow(){const w=innerWidth,h=innerHeight,first=!W,wch=w!==W;if(!first&&!wch&&h<=H)return; /* la barre d'adresse du téléphone qui bouge ne relance pas tout */
  W=w;H=wch?h:Math.max(H,h);DPR=Math.min(2,window.devicePixelRatio||1);for(const c of [snow,$("fx")]){c.width=W*DPR;c.height=H*DPR;c.style.height=H+"px"}sc.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);
  if(first||wch){const n=REDUCED?40:Math.round(Math.min(200,W*H/7000));flakes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+.6,s:Math.random()*.6+.3,p:Math.random()*6.28}));mkExtras()}}
function snowLoop(){sc.clearRect(0,0,W,H);
  for(const f of flakes){f.p+=.01;f.y+=f.s*(1+f.r*.4)*(1+boost);f.x+=Math.sin(f.p)*.4;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}sc.beginPath();sc.fillStyle=`rgba(255,255,255,${.35+f.r*.2})`;sc.arc(f.x,f.y,f.r,0,6.283);sc.fill()}
  for(const e of extras){e.p+=.012;e.y+=e.s*(1+boost*.6);e.x+=Math.sin(e.p)*.5;e.r+=e.vr;if(e.y>H+e.sz){e.y=-e.sz;e.x=Math.random()*W}if(e.y<-e.sz){e.y=H+e.sz;e.x=Math.random()*W}sc.save();sc.globalAlpha=e.a;sc.translate(e.x,e.y);sc.rotate(e.up?Math.sin(e.p)*.25:e.r);drawSpr(sc,e.k,e.sz);sc.restore()}
  boost*=.97;requestAnimationFrame(snowLoop)}
sizeSnow();addEventListener("resize",sizeSnow);requestAnimationFrame(snowLoop);

/* ---------- confettis ---------- */
let parts=[],fxOn=false;
function burst(x,y,n){const cols=cur.confetti||["#ffd76a","#ff4d5e","#3cc47a","#ffffff","#6fb3ff","#ffe9a8"],sp=(cur.sprites||[]).filter(k=>k!=="steam");
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=4+Math.random()*11;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6.283,vr:(Math.random()-.5)*.4,w:5+Math.random()*7,h:3+Math.random()*5,c:cols[i%cols.length],star:Math.random()<.22,k:sp.length&&i%7===0?sp[(i/7|0)%sp.length]:null,sz:R(22,46),life:1})}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function starShape(c,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill()}
function fxLoop(){fx.clearRect(0,0,W,H);parts=parts.filter(p=>p.life>0&&p.y<H+40);
  for(const p of parts){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.004;fx.save();fx.globalAlpha=Math.min(1,p.life*2);fx.translate(p.x,p.y);
    if(p.k){fx.rotate(p.r*.3);drawSpr(fx,p.k,p.sz)}else{fx.rotate(p.r);fx.fillStyle=p.c;if(p.star){fx.shadowColor=p.c;fx.shadowBlur=8;starShape(fx,p.w*.9)}else fx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)))}fx.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fx.clearRect(0,0,W,H)}}

/* ---------- sapin et boules ---------- */
$("names").innerHTML=PEOPLE.map((p,i)=>{const c=ORN[i%ORN.length];return `<div class="slot" id="slot${i}"><button class="orn" type="button" style="--c1:${c[0]};--c2:${c[1]};--sw:${(4+(i%4)*.7).toFixed(1)}s;--sd:${(-i*.6).toFixed(1)}s;--tilt:${TILT[i%12]}deg"></button></div>`}).join("");
function place(el,[x,y]){el.style.left=x+"%";el.style.top=(y/VH*100)+"%"}
function footPos(f){f=((f%12)+12)%12;const q=FOOT0[f];return[q[0],TY(108)+q[1]+footShift+(f>=7?rowGap:0)]}
function treePos(i){return[POS0[i][0],TY(POS0[i][1])]}
function renderTree(drop){
  const d=allDone();
  $("who-title").textContent=doneList().length?"Joyeux Noël !":"Choisis ta boule avec ton prénom !";
  PEOPLE.forEach((p,i)=>{const sl=$("slot"+i),b=sl.querySelector(".orn");b.textContent=p;const f=d.indexOf(p);
    const atFoot=f>=0&&p!==drop;sl.classList.toggle("foot",atFoot);sl.classList.remove("landed");delete sl.dataset.fly;
    b.setAttribute("aria-label",f>=0?p+", déjà tiré : revoir le résultat":p);
    sl.style.transition=p===drop?"none":""});
  fitHome();layoutSlots();
  if(drop){dropBusy=true;setTimeout(()=>{dropBusy=false},2000);const i=PEOPLE.indexOf(drop),sl=$("slot"+i),f=d.indexOf(drop);setTimeout(()=>{sl.style.transition="";sl.dataset.fly="1";place(sl,footPos(f));tone(660,.1,.3,"sine",.06);tone(330,1,.25,"triangle",.1);setTimeout(()=>{delete sl.dataset.fly;sl.classList.add("foot","landed");boost=1.5;if(!document.body.classList.contains("fit"))sl.scrollIntoView({behavior:"smooth",block:"center"})},1100)},700)}
}
$("names").querySelectorAll(".orn").forEach((b,i)=>b.addEventListener("click",()=>{const p=PEOPLE[i];audio();
  if(allDone().includes(p)){openPeek(p);return}
  me=p;$("confirm-name").textContent=me+" ?";show("s-confirm");tone(1320,0,.25,"sine",.08)}));
$("no").addEventListener("click",()=>{me=null;show("s-who")});
$("yes").addEventListener("click",()=>{audio();openWheel(me)});
function toTree(drop){const n=me;applyTheme(null);show("s-who");renderTree(drop?n:null);shSync()}
$("back").addEventListener("click",()=>{const just=$("back").dataset.drop==="1";$("back").dataset.drop="";toTree(just)});
$("rvback").addEventListener("click",()=>{closeReveal();$("back").dataset.drop="";toTree(!memoMode)});
$("back2").addEventListener("click",()=>toTree(false));
/* deuxième avertissement */
let askCb=null,memoMode=false,okAsked=false;
function ask(cb){askCb=cb;$("ask-lead").textContent=T("sure",1);$("ask-name").textContent=(cur.nick||me)+T("q",1);$("ask-yes").textContent=T("yes",1);$("ask-no").textContent=T("no",1);$("ask").hidden=false;tone(520,0,.2,"sine",.08);tone(390,.18,.25,"sine",.08);$("ask-no").focus()}
$("ask-yes").addEventListener("click",()=>{$("ask").hidden=true;const c=askCb;askCb=null;if(c)c()});
$("ask-no").addEventListener("click",()=>{$("ask").hidden=true;askCb=null});
/* boule déjà tirée : on voit les animations, jamais la roue ni le prénom, sauf après le deuxième avertissement */
function openPeek(name){
  me=name;plain=true;applyTheme(name);$("hello").textContent=T("already");
  $("stage").hidden=true;$("result").hidden=true;$("backrow").hidden=true;$("spinrow").hidden=true;setStatus("");
  $("memo").hidden=false;$("memorow").hidden=false;$("again").textContent=T("replay");$("back2").textContent=T("back");
  show("s-wheel");
}
const replay=()=>{audio();if(!$("memo").hidden&&$("ask").hidden&&$("reveal").hidden)ask(()=>openReveal(reveal(me),true))};
$("again").addEventListener("click",replay);$("memo").addEventListener("click",replay);

/* ---------- roue ---------- */
let list=[],rot=0,lastSeg=-1;
function drawWheel(){
  const SEG=cur.seg||DEF.seg,n=list.length,a=2*Math.PI/n,r=104;
  let defs=`<radialGradient id="rim" r=".5"><stop offset=".86" stop-color="#ffe38f"/><stop offset=".93" stop-color="#c58d1b"/><stop offset="1" stop-color="#7a5408"/></radialGradient><radialGradient id="hubg"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#c58d1b"/></radialGradient>`;
  SEG.forEach((c,k)=>defs+=`<radialGradient id="sg${k}" cx="0" cy="0" r="104" gradientUnits="userSpaceOnUse"><stop offset=".15" stop-color="${c[1]}"/><stop offset=".55" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient>`);
  $("wdefs").innerHTML=defs;
  let h="";
  list.forEach((p,i)=>{let k=i%4;if(i===n-1&&k===0)k=2;
    const a0=-Math.PI/2+i*a-a/2,a1=a0+a;
    h+=`<path d="M0 0 L${(r*Math.cos(a0)).toFixed(2)} ${(r*Math.sin(a0)).toFixed(2)} A${r} ${r} 0 0 1 ${(r*Math.cos(a1)).toFixed(2)} ${(r*Math.sin(a1)).toFixed(2)} Z" fill="url(#sg${k})" stroke="#fff3c4" stroke-width="1.2"/>`;
    h+=`<text transform="rotate(${(-90+i*360/n).toFixed(2)}) translate(64 0)" fill="${SEG[k][2]}" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Fredoka,sans-serif" style="paint-order:stroke" stroke="${SEG[k][2]==="#fff"?"rgba(0,0,0,.4)":"rgba(255,255,255,.4)"}" stroke-width="1.5"></text>`});
  h+=`<circle r="104" fill="none" stroke="#fff3c4" stroke-width="1.5"/>`;
  $("wheel").innerHTML=h;
  $("wheel").querySelectorAll("text").forEach((t,i)=>t.textContent=list[i]);
  let b="";for(let i=0;i<24;i++){const t=i*Math.PI/12;b+=`<circle class="rb" cx="${(111*Math.cos(t)).toFixed(2)}" cy="${(111*Math.sin(t)).toFixed(2)}" r="3.6"/>`}$("rimbulbs").innerHTML=b;
  lastSeg=-1;setRot(0);
}
function setRot(d){rot=d;$("wheel").setAttribute("transform",`rotate(${d.toFixed(3)})`);const n=list.length,s=((Math.round(-d/(360/n))%n)+n)%n;if(s!==lastSeg){if(lastSeg!==-1&&spinning){tick();const p=$("pointer");p.classList.remove("tick");void p.getBoundingClientRect();p.classList.add("tick")}lastSeg=s}}
function setStatus(t,sus){const s=$("status");s.textContent=t;s.classList.toggle("suspense",!!sus)}
function openWheel(name){
  me=name;okAsked=false;plain=false;applyTheme(name);list=candidates(name);
  $("stage").hidden=false;$("memo").hidden=true;$("memorow").hidden=true;drawWheel();
  $("hello").textContent=T("hello");
  $("result").hidden=true;$("backrow").hidden=true;$("spinrow").hidden=false;setStatus("");
  $("stage").classList.add("ready");
  show("s-wheel");
}
function showTag(t){$("who").textContent=t;$("result").hidden=false}
/* la roue ralentit et s'arrête directement sur la personne tirée, sans retour en arrière */
function plan(final){return[{to:final,dur:REDUCED?700:R(5500,8000),pw:R(3.2,4.2),hold:REDUCED?0:350,main:true}]}
function run(ph,i,done){if(i>=ph.length)return done();const p=ph[i],from=rot,t0=performance.now();
  const e=p.main?(k=>1-Math.pow(1-k,p.pw)):(k=>.5-.5*Math.cos(Math.PI*k));
  const step=now=>{const k=Math.min(1,(now-t0)/p.dur);setRot(from+(p.to-from)*e(k));if(p.main&&k>.68&&!$("status").classList.contains("suspense"))setStatus(T("suspense"),true);
    if(k<1)requestAnimationFrame(step);else setTimeout(()=>run(ph,i+1,done),p.hold)};
  requestAnimationFrame(step)}
function canSpin(){return !spinning&&me&&!doneList().includes(me)&&!$("s-wheel").hidden&&!$("stage").hidden&&$("reveal").hidden&&$("ask").hidden}
function spin(){
  if(!canSpin())return;
  if(!okAsked&&doneList().length){audio();ask(()=>{okAsked=true;spin()});return}
  spinning=true;audio();$("spinrow").hidden=true;$("stage").classList.remove("ready");
  const target=reveal(me),n=list.length,seg=360/n,i=list.indexOf(target);
  markDone(me);
  const final=-i*seg+R(-.22,.22)*seg-360*(REDUCED?1:6+Math.floor(Math.random()*5));
  $("stage").classList.add("spinning");document.body.classList.add("isspin");setStatus(T("turning"));boost=2;
  if(cur.quake&&!REDUCED)rumble=setInterval(()=>tone(52,0,.35,"sine",.3),520);
  run(plan(final),0,()=>{setRot(final);spinning=false;clearInterval(rumble);$("stage").classList.remove("spinning");document.body.classList.remove("isspin");setStatus("");openReveal(target)});
}
$("spin").addEventListener("click",spin);
$("stage").addEventListener("click",spin);
function openReveal(t,memo){
  memoMode=!!memo;$("rv-pre").textContent=T(memo?"forgot":"pre");$("rv-name").textContent=memo?t+T("fq"):t;$("rv-post").textContent=memo?"":T("post");$("close").hidden=memoMode;
  const rv=$("reveal");rv.hidden=false;rv.className="shake";
  tone(180,0,.15,"triangle",.1);tone(180,.25,.15,"triangle",.1);
  setTimeout(()=>{rv.className="open";fanfare();const g=rv.querySelector(".gift").getBoundingClientRect();burst(g.left+g.width/2,g.top+g.height*.35,REDUCED?40:220);boost=4;
    setTimeout(()=>{burst(W*.15,H*.3,90);burst(W*.85,H*.3,90)},700)},REDUCED?50:1450);
  setTimeout(()=>$("rvback").focus(),2400);
}
function closeReveal(){$("reveal").hidden=true;$("reveal").className=""}
$("close").addEventListener("click",()=>{closeReveal();showTag($("rv-name").textContent);$("hello").textContent=T("bravo");$("backrow").hidden=false;$("back").dataset.drop="1";$("result").scrollIntoView({behavior:"smooth",block:"center"})});

applyTheme(null);show("s-who");renderTree(null);shSync();
}
